<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8">
            <meta content="width=device-width, initial-scale=1" name="viewport">
                <title>
                    分级读物线上图书馆 · Bridging & Chapter Books
                </title>
                <link href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='4' width='20' height='24' rx='2' fill='%232f8f83'/%3E%3Crect x='10' y='4' width='2.4' height='24' fill='%23ffffff' opacity='.55'/%3E%3C/svg%3E" rel="icon"></link>
                <link rel="stylesheet" type="text/css" href="assets/main.css">
            </meta>
        </meta>
    </head>
    <body>
        <header class="top">
            <div class="top-inner">
                <div class="brand-row">
                    <svg aria-hidden="true" class="brand-mark" fill="none" viewbox="0 0 32 32">
                        <rect fill="#2f8f83" height="26" rx="2.5" width="22" x="5" y="3">
                        </rect>
                        <rect fill="#fff" height="26" opacity=".5" width="2.6" x="9.5" y="3">
                        </rect>
                        <rect fill="#fff" height="2.2" opacity=".8" rx="1.1" width="9" x="15" y="7">
                        </rect>
                        <rect fill="#fff" height="2.2" opacity=".55" rx="1.1" width="7" x="15" y="11.5">
                        </rect>
                    </svg>
                    <div class="brand">
                        <h1>
                            分级读物线上图书馆
                        </h1>
                        <p>
                            Bridging Books and Chapter Books Collection · 桥梁 / 初章 / 中章 / 高章
                        </p>
                    </div>
                    <div class="top-stats">
                        <span>
                            馆藏
                            <b id="stat-total">
                                0
                            </b>
                            套
                        </span>
                        <span>
                            真实封面
                            <b id="stat-match">
                                0
                            </b>
                        </span>
                        <span>
                            占位封面
                            <b id="stat-ph">
                                0
                            </b>
                        </span>
                    </div>
                </div>
                <div class="search-row">
                    <div class="search-box">
                        <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2" viewbox="0 0 24 24">
                            <circle cx="11" cy="11" r="7">
                            </circle>
                            <path d="m20 20-3.8-3.8">
                            </path>
                        </svg>
                        <input aria-label="搜索书目" autocomplete="off" id="search" placeholder="搜索书名、作者、中文译名、格式…" type="search">
                        </input>
                    </div>
                    <div class="lx-filter">
                        <select aria-label="按蓝思值筛选" class="lx-select" id="lx">
                        </select>
                    </div>
                    <nav aria-label="分级筛选" class="tabs" id="tabs">
                    </nav>
                </div>
            </div>
        </header>
        <div class="toolbar-note">
            点击书架上的书本可查看完整书目信息、分级、册数、格式与网盘目录入口；有效网盘资源的书籍底部高亮显示。
        </div>
        <main>
            <div class="result-bar">
                <h2 id="result-title">
                    全部馆藏
                </h2>
                <span class="count" id="result-count">
                </span>
            </div>
            <section aria-live="polite" class="shelf-grid" id="grid">
            </section>
            <div class="empty" id="empty" style="display:none">
                <svg fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24">
                    <path d="M4 5h16v14H4z">
                    </path>
                    <path d="M4 9h16M9 5v14">
                    </path>
                </svg>
                <p>
                    没有匹配到的书目，换个关键词试试。
                </p>
            </div>
        </main>
        <footer>
            <div class="inner">
                <div>
                    馆藏数据来自原网盘目录《Bridging Books and Chapter Books Collection》，分级沿用原始分类，未重新判定难度。
                </div>
                <div>
                    封面信息来源：豆瓣图书建议接口；本站不对保存数据的真实性负责，请勿用作商业行为！
                </div>
            </div>
        </footer>
        <button aria-label="返回顶部" class="to-top" id="to-top" type="button">
            <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
                <path d="M12 19V5">
                </path>
                <path d="m5 12 7-7 7 7">
                </path>
            </svg>
        </button>
        <div aria-labelledby="modal-title" aria-modal="true" class="overlay" id="overlay" role="dialog">
            <div class="modal" id="modal">
            </div>
        </div>
        <script src="data/books.js"></script>
        <script src="assets/main.js"></script>
    </body>
</html>
